name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS plugin (VST3 + AU, universal) and installer
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBRASA_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --target Brasa_VST3 Brasa_AU BrasaRender -j 4

      - name: Engine checks (levels, NaN, latency, aliasing, filters, CPU)
        run: build/BrasaRender_artefacts/Release/BrasaRender --test

      - name: Sign (ad hoc) and package
        run: |
          set -e
          ART=build/Brasa_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/Brasa.vst3" dist/
          cp -R "$ART/AU/Brasa.component" dist/
          for b in dist/Brasa.vst3 dist/Brasa.component; do codesign --force --deep --sign - "$b"; done
          lipo -info dist/Brasa.vst3/Contents/MacOS/Brasa
          cp docs/INSTALL-mac.txt dist/
          VERSION=$(sed -n 's/^project(Brasa VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd dist && zip -qry ../Brasa-macOS.zip .)

      - name: Build installer
        run: installer/build_pkg.sh "$VERSION" dist pkg

      - name: Test the installer (fresh install and update over it)
        run: |
          set -e
          rm -rf ~/Library/Audio/Plug-Ins/VST3/Brasa.vst3 ~/Library/Audio/Plug-Ins/Components/Brasa.component
          installer -pkg "pkg/Brasa-$VERSION.pkg" -target CurrentUserHomeDirectory
          test -f ~/Library/Audio/Plug-Ins/VST3/Brasa.vst3/Contents/MacOS/Brasa
          test -f ~/Library/Audio/Plug-Ins/Components/Brasa.component/Contents/MacOS/Brasa
          installer -pkg "pkg/Brasa-$VERSION.pkg" -target CurrentUserHomeDirectory
          cmp ~/Library/Audio/Plug-Ins/VST3/Brasa.vst3/Contents/MacOS/Brasa dist/Brasa.vst3/Contents/MacOS/Brasa
          codesign --verify --deep ~/Library/Audio/Plug-Ins/VST3/Brasa.vst3
          echo "installer OK"

      - name: Validate VST3 with pluginval
        run: |
          set -e
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --timeout-ms 600000 --output-dir pluginval-logs dist/Brasa.vst3

      - name: Validate AU with auval (installed by the installer)
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Bras Dnsh

      - uses: actions/upload-artifact@v4
        with:
          name: Brasa-installer
          path: pkg/Brasa-${{ env.VERSION }}.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: Brasa-macOS
          path: Brasa-macOS.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: ignore

      - name: Publish the latest build to the "downloads" branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p pub && cp "pkg/Brasa-$VERSION.pkg" pub/ && cp Brasa-macOS.zip pub/ && cp docs/INSTALL-mac.txt pub/
          cd pub
          printf '# Brasa %s\n\nУстановщик: **Brasa-%s.pkg** (нажмите на файл, затем «Download raw file»).\nСборка из коммита %s.\n' "$VERSION" "$VERSION" "${GITHUB_SHA::7}" > README.md
          git init -q -b downloads
          git config user.name "Brasa CI"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Brasa $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" downloads

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Brasa-macOS.zip
            pkg/Brasa-${{ env.VERSION }}.pkg
