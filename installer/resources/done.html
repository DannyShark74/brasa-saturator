<h2>Готово</h2>
<p>Откройте FL Studio → <b>Options → Manage plugins → Find installed plugins</b>.
Brasa появится среди эффектов (VST3: «Brasa», производитель Danny Shark). Вставляется в слот микшера.</p>
<p>Кнопка <b>HQ</b> включает 8-кратный оверсемплинг: чище верх, чуть больше нагрузка на процессор.</p>
